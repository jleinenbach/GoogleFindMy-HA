name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}


      - name: Detect hassfest auto-fix check
        id: hassfest_autofix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ.get("GITHUB_TOKEN")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{target_sha}/check-runs"
          )
          request.add_header("Accept", "application/vnd.github+json")
          if token:
              request.add_header("Authorization", f"Bearer {token}")

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:  # pragma: no cover - network error surface
              print(f"Warning: unable to query check runs (status={exc.code}). Assuming none present.")
              payload = {"check_runs": []}
          except urllib.error.URLError as exc:  # pragma: no cover - network error surface
              print(f"Warning: unable to reach GitHub API ({exc}). Assuming no matching checks.")
              payload = {"check_runs": []}

          pattern = re.compile(r"(?i)^hassfest( \(auto-fix\)( / hassfest.*)?)?$")
          has_match = any(
              pattern.search(run.get("name", ""))
              for run in payload.get("check_runs", [])
          )

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"found={'true' if has_match else 'false'}\n")

          print(
              "Detected hassfest (auto-fix) check: {}".format(
                  "yes" if has_match else "no"
              )
          )
          PY

      - name: Wait for hassfest auto-fix workflow to finish
        if: steps.hassfest_autofix.outputs.found == 'true'
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: '^[Hh]assfest( \(auto-fix\)( / hassfest.*)?)?$'
          allowed-conclusions: 'success,failure,neutral'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Run hassfest
        id: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Write hassfest summary
        if: always()
        run: |
          {
            echo "## Hassfest Validation"
            echo ""
            if [ "${{ steps.hassfest.outcome }}" = "success" ]; then
              echo "✅ **Manifest validation passed**"
              echo ""
              echo "The \`manifest.json\` and integration structure are valid."
            else
              echo "❌ **Manifest validation failed**"
              echo ""
              echo "Check the logs above for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    needs: hassfest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Probe brands endpoint
        id: brands_probe
        run: |
          set -u
          if curl -sSfL https://brands.home-assistant.io/domains.json >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::brands.home-assistant.io unavailable; skipping HACS validation to avoid false negatives."
          fi

      - name: Run HACS validation
        if: steps.brands_probe.outputs.available == 'true'
        id: hacs
        continue-on-error: true
        uses: hacs/action@main
        with:
          category: integration
          ignore: topics issues

      # Transient HACS regression guard (hacs/integration#5252): the action
      # intermittently fetches the raw hacs.json / manifest.json as None from
      # the GitHub contents API and reports "invalid 'hacs.json' file" and
      # "integration_manifest ... Got None" on byte-identical, valid files.
      # If the first run fails, re-run with exactly those two transient-prone
      # validators isolated. If everything else passes, the failure was the
      # known transient signature and is tolerated (job stays green with a
      # warning). The isolation is NOT permanent: it only runs on failure, so a
      # healthy HACS still exercises all checks. The real validity of both files
      # is still enforced independently at the ci-success level: manifest.json by
      # the hassfest job (this job needs: hassfest) and hacs.json by the test job
      # (tests/test_hacs_validation.py). Any other failing check keeps this red.
      - name: Re-run HACS validation (isolate transient checks)
        if: steps.brands_probe.outputs.available == 'true' && steps.hacs.outcome == 'failure'
        id: hacs_surgical
        continue-on-error: true
        uses: hacs/action@main
        with:
          category: integration
          ignore: topics issues hacsjson integration_manifest

      - name: Classify HACS result
        if: steps.brands_probe.outputs.available == 'true'
        id: hacs_verdict
        env:
          FIRST: ${{ steps.hacs.outcome }}
          RETRY: ${{ steps.hacs_surgical.outcome }}
        run: |
          set -u
          if [ "$FIRST" = "success" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          elif [ "$RETRY" = "success" ]; then
            echo "::warning ::HACS validation failed only on the transient-prone checks (hacsjson, integration_manifest) and passed once they were isolated; treating as the known transient upstream regression (hacs/integration#5252). File validity is still enforced by the hassfest and test jobs."
            echo "status=transient" >> "$GITHUB_OUTPUT"
          else
            echo "::error ::HACS validation failed on a check beyond the known transient signature; treating as a real defect."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Write HACS summary
        if: always()
        run: |
          {
            echo "## HACS Validation"
            echo ""
            if [ "${{ steps.brands_probe.outputs.available }}" != "true" ]; then
              echo "⚠️ **Skipped** - brands.home-assistant.io unavailable"
            elif [ "${{ steps.hacs_verdict.outputs.status }}" = "passed" ]; then
              echo "✅ **HACS validation passed**"
              echo ""
              echo "The integration meets HACS requirements."
            elif [ "${{ steps.hacs_verdict.outputs.status }}" = "transient" ]; then
              echo "⚠️ **HACS validation passed after isolating transient checks** - tolerated upstream regression (hacs/integration#5252)."
              echo ""
              echo "Only hacsjson/integration_manifest failed; file validity is enforced by the hassfest and test jobs."
            else
              echo "❌ **HACS validation failed**"
              echo ""
              echo "Check the logs above for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  translations:
    name: Translations validation
    runs-on: ubuntu-latest
    needs: hassfest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run translations sync check
        id: translations_sync
        run: python script/sync_translations.py --check

      - name: Run translation key coverage check
        id: translation_keys
        run: python script/translation_key_check.py

      - name: Run translation placeholder symmetry check
        id: translation_placeholders
        run: python script/translation_placeholder_check.py --github

      - name: Write translations summary
        if: always()
        run: |
          {
            echo "## Translations Validation"
            echo ""
            if [ "${{ steps.translations_sync.outcome }}" = "success" ] \
              && [ "${{ steps.translation_keys.outcome }}" = "success" ] \
              && [ "${{ steps.translation_placeholders.outcome }}" = "success" ]; then
              echo "✅ **All translation gates passed**"
              echo ""
              echo "* ``sync_translations.py --check`` (locales aligned with strings.json)"
              echo "* ``translation_key_check.py`` (no missing keys per locale)"
              echo "* ``translation_placeholder_check.py`` (issue placeholders match code)"
            else
              echo "❌ **Translation drift detected**"
              echo ""
              echo "| Gate | Result |"
              echo "| --- | --- |"
              echo "| sync_translations | ${{ steps.translations_sync.outcome }} |"
              echo "| translation_keys | ${{ steps.translation_keys.outcome }} |"
              echo "| translation_placeholders | ${{ steps.translation_placeholders.outcome }} |"
              echo ""
              echo "See the failing step above for the affected keys."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  vendored_assets:
    name: Vendored assets freshness
    runs-on: ubuntu-latest
    needs: hassfest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Dependabot reads manifests, never checked-in files. Without this gate a
      # bump of the `leaflet` devDependency would leave the embedded copy behind
      # and nothing would go red. No network and no Node needed: the check
      # compares package.json against vendor/leaflet/VERSION and the recorded
      # digests against the files themselves.
      - name: Check the vendored Leaflet copy
        id: vendor_leaflet
        run: python script/vendor_leaflet.py --check

      - name: Write vendored assets summary
        if: always()
        run: |
          {
            echo "## Vendored assets"
            echo ""
            if [ "${{ steps.vendor_leaflet.outcome }}" = "success" ]; then
              echo "✅ **Leaflet copy matches the pinned version and its digests**"
            else
              echo "❌ **Vendored Leaflet is out of step**"
              echo ""
              echo "Run \`npm install && python script/vendor_leaflet.py\` and commit the result."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (${{ matrix.check }})
    runs-on: ubuntu-latest
    needs: hassfest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, mypy, codespell, bandit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      # The Python version belongs in both the key and the restore prefix. The
      # cached artefact is a complete virtualenv, so an interpreter-agnostic
      # prefix can restore a 3.13 `.venv` built before the lock moved to
      # `^3.14.2`; Poetry then adopts that interpreter as the project
      # environment and `poetry install` refuses it, taking all four lint jobs
      # down before they run. The `test` job already keys this way.
      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-py3.14-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-py3.14-poetry-

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Run Ruff
        if: matrix.check == 'ruff'
        id: ruff
        run: |
          set +e
          poetry run ruff check . 2>&1 | tee ruff_output.txt
          CHECK_EXIT=${PIPESTATUS[0]}
          poetry run ruff format --check . 2>&1 | tee -a ruff_output.txt
          FORMAT_EXIT=${PIPESTATUS[0]}
          EXIT_CODE=$(( CHECK_EXIT > FORMAT_EXIT ? CHECK_EXIT : FORMAT_EXIT ))
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Run mypy (strict)
        if: matrix.check == 'mypy'
        id: mypy
        run: |
          set +e
          {
            poetry run mypy --install-types --non-interactive --strict -p custom_components.googlefindmy
            poetry run mypy --install-types --non-interactive --strict -p tests
          } 2>&1 | tee mypy_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Run codespell
        if: matrix.check == 'codespell'
        id: codespell
        continue-on-error: true  # Non-blocking - informational only
        run: |
          set +e
          poetry run codespell 2>&1 | tee codespell_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Run bandit (security)
        if: matrix.check == 'bandit'
        id: bandit
        run: |
          set +e
          # Run bandit security scanner on custom_components and tests
          # Exclude known false positives and test files that intentionally test security
          poetry run bandit -r custom_components -c pyproject.toml -f txt 2>&1 | tee bandit_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Write lint summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.check }} Results"
            echo ""
            if [ "${{ matrix.check }}" = "ruff" ]; then
              if [ -f ruff_output.txt ]; then
                ISSUES=$(grep -c "^" ruff_output.txt 2>/dev/null || echo "0")
                if [ "$ISSUES" = "0" ] || [ ! -s ruff_output.txt ]; then
                  echo "✅ **No issues found**"
                else
                  echo "❌ **Issues found:**"
                  echo ""
                  echo '```'
                  head -100 ruff_output.txt
                  echo '```'
                fi
              fi
            elif [ "${{ matrix.check }}" = "mypy" ]; then
              if [ -f mypy_output.txt ]; then
                ERRORS=$(grep -c "error:" mypy_output.txt 2>/dev/null || echo "0")
                if [ "$ERRORS" = "0" ]; then
                  echo "✅ **No type errors found**"
                else
                  echo "❌ **$ERRORS type error(s) found:**"
                  echo ""
                  echo '```'
                  head -100 mypy_output.txt
                  echo '```'
                fi
              fi
            elif [ "${{ matrix.check }}" = "codespell" ]; then
              if [ -f codespell_output.txt ]; then
                if [ ! -s codespell_output.txt ]; then
                  echo "✅ **No spelling errors found**"
                else
                  echo "ℹ️ **Spelling suggestions (non-blocking):**"
                  echo ""
                  echo "These are informational only. Add false positives to \`pyproject.toml\` ignore-words-list."
                  echo ""
                  echo '```'
                  cat codespell_output.txt
                  echo '```'
                fi
              fi
            elif [ "${{ matrix.check }}" = "bandit" ]; then
              if [ -f bandit_output.txt ]; then
                ISSUES=$(grep -c "Issue:" bandit_output.txt 2>/dev/null || echo "0")
                if [ "$ISSUES" = "0" ]; then
                  echo "✅ **No security issues found**"
                else
                  echo "⚠️ **$ISSUES potential security issue(s) found:**"
                  echo ""
                  echo '```'
                  cat bandit_output.txt
                  echo '```'
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs:
      - hassfest
      - hacs
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant requires Python >=3.14.2 from Core 2026.3.0 onwards, so
        # the Poetry lock resolves the dev/test tree only for 3.14+. Python 3.13
        # is still what users on Core <=2026.2.x run; that axis is covered by the
        # lock-free `test_legacy_python` job below, not by this matrix.
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-py${{ matrix.python-version }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-poetry-

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libc-ares-dev

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          poetry run pytest -q --cov --cov-report=xml --cov-report=term --cov-fail-under=78 2>&1 | tee pytest_output.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Write short summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "## Pytest summary (Python ${{ matrix.python-version }})"
            echo
            echo '```'
            tail -n 200 pytest_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test_legacy_python:
    name: Test (Python 3.13, ${{ matrix.label }})
    runs-on: ubuntu-latest
    needs:
      - hassfest
      - hacs
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor hacs.json actually declares. The stub constraints in the
          # repository pin 2025.12.1, which is a speed-up for local runs and not
          # a compatibility claim; testing there would leave the pre-2025.11
          # paths -- such as the `EntityCategory` import fallback in button.py --
          # unexercised by every axis. 0.13.278 is the plugin release that
          # carries Home Assistant 2025.9.1.
          - label: "declared floor"
            ha_pin: "2025.9.1"
            plugin_pin: "0.13.278"
          # The last Home Assistant line that still supports Python 3.13
          # (2026.2.3). Without this axis the final three 3.13-era releases go
          # untested. Both pins are dropped so pip resolves the newest release
          # that satisfies the interpreter; `pycares<5` in the same file stays.
          - label: "last 3.13 line"
            ha_pin: ""
            plugin_pin: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libc-ares-dev

      # Deliberately lock-free: poetry.lock resolves the dev/test tree for
      # Python >=3.14.2 only, because Home Assistant Core requires 3.14.2 from
      # 2026.3.0 onwards. Installing from the plain requirement files keeps the
      # Python 3.13 axis under test, which is what users on Core 2025.9.1
      # through 2026.2.x run and where the backwards-compatibility shims fire.
      # Guards against silent drift: if someone raises the floor in hacs.json,
      # this axis would keep testing the old one and the label would lie.
      - name: Verify the pinned floor still matches hacs.json
        if: matrix.ha_pin != ''
        run: |
          set -euo pipefail
          declared="$(python -c 'import json;print(json.load(open("hacs.json"))["homeassistant"])')"
          if [ "$declared" != "${{ matrix.ha_pin }}" ]; then
            echo "::error::hacs.json declares Home Assistant $declared but this axis pins ${{ matrix.ha_pin }}. Update the matrix entry (and the pytest plugin release that carries it)."
            exit 1
          fi
          echo "hacs.json floor: $declared"

      - name: Rewrite the stub constraints for this axis
        run: |
          set -euo pipefail
          constraints=custom_components/googlefindmy/constraints-test-stubs.txt
          sed -i -E '/^(homeassistant|pytest-homeassistant-custom-component)==/d' "$constraints"
          if [ -n "${{ matrix.ha_pin }}" ]; then
            printf 'homeassistant==%s\n' "${{ matrix.ha_pin }}" >> "$constraints"
            printf 'pytest-homeassistant-custom-component==%s\n' "${{ matrix.plugin_pin }}" >> "$constraints"
          fi
          echo "Constraints for this axis:"
          cat "$constraints"

      - name: Install dependencies without the Poetry lock
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/googlefindmy/requirements-dev.txt

      # Printed, and asserted, so this job's claim about which Home Assistant
      # line it exercised is measured rather than inferred from the matrix
      # label. Without the assertion a future change to the constraints file
      # could silently collapse both axes onto the same release.
      - name: Report and verify the resolved Home Assistant version
        run: |
          set -euo pipefail
          resolved="$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')"
          echo "homeassistant==${resolved}"
          echo "pytest-homeassistant-custom-component==$(python -c 'from importlib.metadata import version; print(version("pytest-homeassistant-custom-component"))')"
          if [ -n "${{ matrix.ha_pin }}" ]; then
            if [ "${resolved}" != "${{ matrix.ha_pin }}" ]; then
              echo "::error::The floor axis resolved to ${resolved}, not the pinned ${{ matrix.ha_pin }}."
              exit 1
            fi
          else
            if [ "${resolved}" = "2025.9.1" ]; then
              echo "::error::The unpinned axis resolved to the declared floor (${resolved}); both axes are testing the same release."
              exit 1
            fi
          fi

      # No coverage gate here: coverage is measured once, by the `test` job on
      # the primary axis. This job answers a single question, namely whether
      # the suite still passes on Python 3.13 against the last Home Assistant
      # line that supports it.
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest -q --no-cov 2>&1 | tee pytest_legacy_output.log

      - name: Write short summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "## Pytest summary (Python 3.13, ${{ matrix.label }})"
            echo
            echo '```'
            tail -n 200 pytest_legacy_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Summary job to require all tests pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [hassfest, hacs, lint, test, test_legacy_python, translations, vendored_assets]
    if: always()
    steps:
      - name: Check all jobs passed
        id: check
        run: |
          if [[ "${{ needs.hassfest.result }}" != "success" ]] || \
             [[ "${{ needs.hacs.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test_legacy_python.result }}" != "success" ]] || \
             [[ "${{ needs.translations.result }}" != "success" ]] || \
             [[ "${{ needs.vendored_assets.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All CI jobs passed!"
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Write CI summary
        if: always()
        run: |
          {
            echo "# CI Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"

            if [ "${{ needs.hassfest.result }}" = "success" ]; then
              echo "| Hassfest | ✅ Pass |"
            else
              echo "| Hassfest | ❌ Fail |"
            fi

            if [ "${{ needs.hacs.result }}" = "success" ]; then
              echo "| HACS | ✅ Pass |"
            else
              echo "| HACS | ❌ Fail |"
            fi

            if [ "${{ needs.vendored_assets.result }}" = "success" ]; then
              echo "| Vendored assets | ✅ Pass |"
            else
              echo "| Vendored assets | ❌ Fail |"
            fi

            if [ "${{ needs.lint.result }}" = "success" ]; then
              echo "| Lint (ruff, mypy, codespell, bandit) | ✅ Pass |"
            else
              echo "| Lint (ruff, mypy, codespell, bandit) | ❌ Fail |"
            fi

            if [ "${{ needs.test.result }}" = "success" ]; then
              echo "| Tests | ✅ Pass |"
            else
              echo "| Tests | ❌ Fail |"
            fi

            if [ "${{ needs.test_legacy_python.result }}" = "success" ]; then
              echo "| Tests (Python 3.13, legacy HA) | ✅ Pass |"
            else
              echo "| Tests (Python 3.13, legacy HA) | ❌ Fail |"
            fi

            if [ "${{ needs.translations.result }}" = "success" ]; then
              echo "| Translations | ✅ Pass |"
            else
              echo "| Translations | ❌ Fail |"
            fi

            echo ""
            if [ "${{ steps.check.outputs.passed }}" = "true" ]; then
              echo "## ✅ All checks passed!"
            else
              echo "## ❌ Some checks failed"
              echo ""
              echo "Please review the failed jobs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
