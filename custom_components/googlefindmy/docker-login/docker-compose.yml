services:
  googlefindmy-login:
    # One-shot login job, not a long-running service. The launcher starts it with
    # `docker compose run --rm` (see login.sh / login.cmd): that creates a fresh
    # ephemeral container per run and removes it on exit, so repeated logins never
    # stack containers, and it attaches your terminal's STDIN so the interactive
    # "Press Enter" prompt works (plain `docker compose up` does not forward it).
    build:
      # Build context is the integration package dir (this file lives in
      # <context>/docker-login/). It holds requirements.txt (baked in) and
      # docker-login/entrypoint.sh. The integration *code* is NOT built in — see
      # the read-only volume below (M2 runtime mount).
      context: ..
      dockerfile: docker-login/Dockerfile
    stdin_open: true      # interactive login: main.py prompts "Press Enter"
    tty: true
    shm_size: "2g"        # headful Chrome needs shared memory
    environment:
      # Optional CLI flags forwarded to main.py, e.g. "--reauth" (force fresh
      # login) or "--debug" (verbose bootstrap/FCM logging). Default: none.
      GFMY_ARGS: "${GFMY_ARGS:-}"
      # Persist secrets.json on the writable ./data volume (see below) instead of
      # inside the read-only code mount. main.py honours this override and keeps
      # the atomic write on a single writable filesystem.
      GOOGLEFINDMY_SECRETS_PATH: "/data/secrets.json"
      # Mark this as the docker-login container so the interactive auth flow
      # prints container-correct instructions (open the noVNC URL) instead of
      # the desktop text ("install Chrome on your system"). The auth flow's own
      # `homeassistant in sys.modules` heuristic does NOT fire in the standalone
      # main.py process, so this explicit signal is required (not just cleaner).
      # entrypoint.sh also defaults it on, so a manual `docker run` is covered.
      GOOGLEFINDMY_CONTAINER_LOGIN: "1"
      # The browsable noVNC URL printed at the login prompt. login.sh exports the
      # normalised host (LAN address with --ip, else loopback); a manual
      # `docker compose run` without the launcher falls back to localhost.
      GOOGLEFINDMY_NOVNC_URL: "http://${GFMY_NOVNC_URL_HOST:-localhost}:7900"
      # Host UID/GID for the ownership handoff of the produced secrets.json. The
      # launcher (login.sh) passes these so the finished file ends up owned by
      # *you* with owner-only 0600 (readable/copyable by you, private from other
      # local accounts). Unset (e.g. a manual run) → the file stays container-owned.
      GFMY_HOST_UID: "${GFMY_HOST_UID:-}"
      GFMY_HOST_GID: "${GFMY_HOST_GID:-}"
      # One-click handoff tracks (both default OFF; the classic file-handoff
      # behaviour is unchanged unless you opt in). They are independent switches.
      #   GFMY_ONECLICK=1  -> after login, serve the bundle to Home Assistant on
      #                       a one-shot, nonce-authenticated LOOPBACK endpoint
      #                       (host 127.0.0.1, port 7901). The matching host
      #                       publish is NOT in this file: it lives in the opt-in
      #                       overlay docker-compose.oneclick.yml (see `ports:`).
      #   GFMY_CLEARTEXT=1 -> after login, print secrets.json in the terminal for
      #                       manual copy/paste (no port opened) and delete it.
      #                       Independent of GFMY_ONECLICK: with both set it runs
      #                       after the endpoint returns, and only if the file is
      #                       still there (i.e. the lockout case -- an acked or
      #                       TTL-expired handoff has already deleted it).
      # NOTE: the pairing code is generated at RUNTIME and printed by the
      # container; there is intentionally NO GFMY_PAIRING_CODE default here.
      GFMY_ONECLICK: "${GFMY_ONECLICK:-}"
      GFMY_CLEARTEXT: "${GFMY_CLEARTEXT:-}"
      # Optional: pin Chrome's major version if auto-detection ever mismatches
      # the bundled Chrome (undetected-chromedriver SessionNotCreatedException).
      # GOOGLEFINDMY_CHROME_VERSION: "141"
    ports:
      # noVNC web viewer (password: secret, a fixed default of the base image).
      # Bound to LOOPBACK by default so the fixed-password session is NOT exposed
      # to the LAN/Internet during the Google sign-in. To reach it from another
      # machine, use an SSH tunnel (recommended) or set GFMY_NOVNC_BIND=0.0.0.0
      # (README → Remote access) to opt into a LAN bind on a trusted network.
      - "${GFMY_NOVNC_BIND:-127.0.0.1}:7900:7900"
      # The one-click token endpoint (port 7901) is deliberately NOT published
      # here. Its publish lives in the opt-in overlay file
      # `docker-compose.oneclick.yml`, which the launchers add only when
      # GFMY_ONECLICK=1:
      #   docker compose -f docker-compose.yml -f docker-compose.oneclick.yml \
      #     run --build --service-ports --rm googlefindmy-login
      #
      # WHY THE SPLIT: both launchers always start this service with
      # `--service-ports`, so EVERY entry in this list is published on EVERY run.
      # An unconditional 7901 entry therefore made the whole container fail to
      # start whenever port 7901 was already taken on the host (another service,
      # a leftover container), and that also killed the two handoff tracks that
      # never touch the port: the file handoff through ./data, and the
      # GFMY_CLEARTEXT=1 terminal output. Compose cannot drop a `ports:` entry
      # conditionally, so the conditional part moves into a second file.
      #
      # WHY IT STAYS ON LOOPBACK when it IS published: the overlay pins it to
      # 127.0.0.1 and nothing else, because that endpoint hands out the freshly
      # minted tokens in the clear. That host publish IS the security boundary,
      # and there is deliberately NO LAN opt-in for this port (unlike
      # GFMY_NOVNC_BIND for noVNC above). From another machine, tunnel instead:
      #   ssh -L 7901:127.0.0.1:7901 <docker-host>
      # NOTE on the in-container bind: token_server.py binds 0.0.0.0 *inside* the
      # container ON PURPOSE. Under the default bridge network Docker DNATs the
      # published port onto the container's eth0, NOT its loopback, so a
      # container-127.0.0.1 bind would make the port unreachable. The no-LAN
      # guarantee is enforced by the loopback host publish `127.0.0.1:7901:7901`
      # in the overlay, not by the container bind. Do NOT run this service with
      # `network_mode: host`: that collapses the bridge and would make the
      # 0.0.0.0 bind LAN-visible (README).
    volumes:
      # M2 runtime mount of the integration code, READ-ONLY, at a FLAT path.
      # `..` is the integration package dir, so main.py lands at /app/gfmy/main.py
      # (parent = "app", not "custom_components") → _standalone=True: it stubs
      # homeassistant.* and never imports the package __init__/config_flow (which
      # need voluptuous/HA). The Auth package (token_cache.py etc.) stays present
      # and readable; nothing is written here.
      - ..:/app/gfmy:ro
      # Writable, host-persisted volume for the produced secrets.json. This is
      # the file you use in Home Assistant. Kept separate from the read-only code
      # mount so the atomic write works and the login container never writes into
      # your integration source. The launcher makes this dir writable by the
      # container user (see login.sh / login.cmd).
      - ./data:/data
