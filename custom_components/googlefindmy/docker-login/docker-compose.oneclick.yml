# Opt-in overlay for the ONE-CLICK handoff (Track B, GFMY_ONECLICK=1).
#
# It adds exactly one thing to docker-compose.yml: the host publish of the
# one-shot token endpoint on port 7901.
#
# HOW TO USE IT
#   The launchers do it for you when you ask for one-click:
#     GFMY_ONECLICK=1 bash login.sh       (Linux/macOS/QNAP)
#     set GFMY_ONECLICK=1 && login.cmd    (Windows)
#   By hand it is:
#     docker compose -f docker-compose.yml -f docker-compose.oneclick.yml \
#       run --build --service-ports --rm googlefindmy-login
#   On Windows, set the switch on ITS OWN LINE for a by-hand run. In a
#   `set GFMY_ONECLICK=1 && docker compose ...` one-liner, cmd.exe keeps the
#   blank in front of the `&&`, so the value becomes "1 ", Compose interpolates
#   it verbatim below, and the container's entrypoint gate (which compares
#   against "1") silently stays off. login.cmd strips that blank from every
#   GFMY_* switch before it calls Compose; a hand-typed compose call has
#   nothing that would. (login.sh needs no such trim: `VAR=1 bash login.sh` is an
#   assignment prefix, which cannot pick up a trailing blank.)
#   Note: passing any `-f` disables Compose's implicit auto-load of a
#   `docker-compose.override.yml`, so list that file explicitly too if you keep
#   one (the launchers do this as well).
#
# WHY THIS IS A SEPARATE FILE
#   The launchers always start the login service with `--service-ports`, so
#   every `ports:` entry of docker-compose.yml is published on every run, and
#   Compose cannot make a single entry conditional. With 7901 declared in the
#   base file, a host that already used port 7901 (another service, a leftover
#   container) made the container fail to start, which also broke the two
#   handoff tracks that do not need the port at all: the file handoff through
#   ./data, and the GFMY_CLEARTEXT=1 clear-text terminal output. Keeping the
#   publish here means those tracks start with no 7901 publish whatsoever.
#
# WHY THE PUBLISH DEFAULTS TO 127.0.0.1
#   This endpoint serves the freshly minted tokens IN THE CLEAR, guarded only by
#   a runtime pairing code, a 300-second expiry, a single successful fetch and a
#   lockout after five wrong codes. The host-side publish is therefore the
#   security boundary, and it stays on loopback unless you say otherwise:
#     GFMY_ONECLICK_BIND=192.168.1.21 GFMY_ONECLICK=1 bash login.sh
#   The widening exists because a loopback-only endpoint is reachable exactly
#   where the file handoff already works (same host, shared network namespace);
#   a Home Assistant in its own bridge container, or on another machine, cannot
#   use it at all. Rules that stay in force:
#     * the DEFAULT is loopback -- an unset variable must never widen anything,
#     * a wildcard host part (0.0.0.0, ::, *) is refused, by the launchers AND
#       by the entrypoint itself, so the direct-Compose path below cannot slip
#       past it: a concrete address can always replace it, and this port hands
#       out credentials rather than guarding them behind a password like noVNC,
#     * a widened bind is plain http on the wire, so it is for a trusted LAN or
#       the host itself, for the seconds the handoff takes -- never the internet,
#     * never add `network_mode: host` (that removes the bridge and the publish
#       indirection, exposing the container's 0.0.0.0 bind on every interface).
#   Staying on loopback from another machine is still possible with a tunnel:
#     ssh -L 7901:127.0.0.1:7901 <docker-host>
services:
  googlefindmy-login:
    environment:
      # Adding this overlay IS the opt-in, so one-click defaults to ON here;
      # an explicit GFMY_ONECLICK from your shell still wins.
      GFMY_ONECLICK: "${GFMY_ONECLICK:-1}"
      # The host bind of the token port, forwarded for the SAME reason
      # docker-compose.yml forwards GFMY_NOVNC_BIND: a bare `docker compose run`
      # does not hand the launcher's shell environment to the container, and the
      # `ports:` entry below is read by COMPOSE ON THE HOST, never by the
      # container. Without this line the entrypoint would have to guess, and it
      # would guess "127.0.0.1" -- printing a handoff address that a widened run
      # does not serve on, while the launcher printed the real one. Same value,
      # same default, one truth. It is an address only; it grants nothing.
      GFMY_ONECLICK_BIND: "${GFMY_ONECLICK_BIND:-}"
    ports:
      # Merged onto (not replacing) the base file's noVNC publish. Three-part
      # mapping HOST_IP:HOST_PORT:CONTAINER_PORT; the leading host address is the
      # security boundary, the two equal port numbers are just host and container
      # side of the same service. The host side DEFAULTS to loopback and is only
      # widened by an explicit GFMY_ONECLICK_BIND, exactly like noVNC's
      # GFMY_NOVNC_BIND on 7900 -- with two differences that matter, enforced
      # outside this file because Compose cannot validate a value: a wildcard is
      # REFUSED for this port instead of merely warned about (in login.sh and
      # login.cmd, and again in the entrypoint, which is the only place a direct
      # `docker compose run` with a .env also passes), and a non-loopback value
      # triggers a clear-text warning before the container starts.
      # Keep the `:-127.0.0.1` default: without it a stray empty variable
      # in a shell, .env file or compose wrapper would publish on every interface.
      # Where both containers already share a network, no host publish is needed
      # at all -- see the shared-network route in README.md.
      - "${GFMY_ONECLICK_BIND:-127.0.0.1}:7901:7901"
